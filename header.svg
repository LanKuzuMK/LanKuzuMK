<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a10"/>
      <stop offset="40%" stop-color="#14121a"/>
      <stop offset="80%" stop-color="#1b1722"/>
      <stop offset="100%" stop-color="#0b0a10"/>
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fae8b4"/>
      <stop offset="25%" stop-color="#dfc37b"/>
      <stop offset="50%" stop-color="#9a7732"/>
      <stop offset="75%" stop-color="#f5e09e"/>
      <stop offset="100%" stop-color="#c9a24b"/>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0a10" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c9a24b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#dfc37b" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfc37b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#73521b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b0a10" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Cyber Matrix Grid Pattern -->
    <pattern id="headerGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#c9a24b" stroke-width="0.35" opacity="0.12"/>
      <circle cx="40" cy="0" r="1.2" fill="#dfc37b" opacity="0.25"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#headerGrid)"/>

  <!-- Fluid Geometric Waves -->
  <path d="M 0,160 Q 300,90 600,170 T 1200,120 L 1200,240 L 0,240 Z" fill="url(#wave1)"/>
  <path d="M 0,190 Q 350,130 700,200 T 1200,160 L 1200,240 L 0,240 Z" fill="url(#wave2)"/>
  <path d="M 0,220 Q 400,180 800,225 T 1200,205 L 1200,240 L 0,240 Z" fill="#0b0a10" opacity="0.85"/>
  <path d="M 0,140 Q 450,70 900,160 T 1200,110" fill="none" stroke="url(#cyanAccent)" stroke-width="1.5"/>

  <!-- Central Crest / Monogram -->
  <g transform="translate(600, 85)" text-anchor="middle">
    <!-- Outer Decorative Hex / Ring -->
    <circle cx="0" cy="-5" r="44" fill="#16141c" stroke="url(#goldMetallic)" stroke-width="2" filter="url(#goldGlow)" opacity="0.9"/>
    <circle cx="0" cy="-5" r="38" fill="none" stroke="#dfc37b" stroke-width="0.75" stroke-dasharray="4,3" opacity="0.6"/>

    <!-- MK Title -->
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Cinzel', serif" font-size="38" font-weight="900" fill="url(#goldMetallic)" letter-spacing="4">MK</text>
  </g>

  <!-- Title & Subtitle Below Monogram -->
  <text x="600" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#f3eee3" text-anchor="middle" letter-spacing="3">FULL-STACK · 3D WEB · MOBILE &amp; DESKTOP ARCHITECT</text>
  <text x="600" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Manrope', sans-serif" font-size="11" font-weight="500" fill="#dfc37b" text-anchor="middle" letter-spacing="2" opacity="0.85">iOS · Android · Windows · macOS · Modern Web</text>
</svg>