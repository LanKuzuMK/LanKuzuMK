name: Generate Contribution Snake

on:
  schedule:
    # Run once every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake files
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake-dark.gif?color_snake=#dfc37b&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            assets/github-snake-light.gif?color_snake=#c9a24b&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#dfc37b
            assets/github-snake-light.svg?palette=github-light&color_snake=#c9a24b

      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: "chore: auto-update contribution snake animation"
          add: "assets/*"
